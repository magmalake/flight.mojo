[workspace]
authors = ["Marius S <39998+winding-lines@users.noreply.github.com>"]
channels = ["https://conda.modular.com/max", "conda-forge"]
name = "flight.mojo"
version = "0.1.0"
description = "Apache Arrow Flight for Mojo — an IPC writer and a Flight server over flare's gRPC"
preview = ["pixi-build"]
platforms = ["osx-arm64", "linux-64"]

[dependencies]
# Tracks flare's pin, which is what this cap was always for. flare used to
# spell `Atomic[DType.…]` — the Mojo 1.0 form — so anything pulling flare in
# was held below 1.1.0. Upstream flare moved to `Atomic[T]` and floored itself
# at 1.1.0 (ehsanmok/flare#31, fixed in `f6b5b16`), and flare_mlake 0.10.2
# carries that, so the cap comes off.
mojo = ">=1.1.0,<2.0.0"
# flare supplies HTTP/2, gRPC framing and the server; see tins = ["flare_mlake"]
# in shelf.toml. Consumed by source path during development
# (`-I ../flare_mlake`), the same way the other magmalake tins are.
#
# Building flare from source means owning its native dependencies too: it
# dlopens shims it builds itself (libflare_tls, libflare_zlib, libflare_brotli)
# out of these. Taking the published tin instead would bring them along.
# The Parquet page codecs, as git dependencies rather than by source path:
# what is needed at *runtime* is their C shims installed into the environment
# (libzstdmojo, liblz4mojo, libbrotlimojo), which a `-I ../x.mojo/src` include
# does not provide. Without them a server reads the uncompressed gate fixture
# happily and then aborts on the first real table, because zstd is what
# Iceberg writes Parquet with by default. iceberg.mojo declares them the same
# way and for the same reason.
zstd-mojo = { git = "https://github.com/magmalake/zstd.mojo" }
lz4-mojo = { git = "https://github.com/magmalake/lz4.mojo" }
brotli-mojo = { git = "https://github.com/magmalake/brotli.mojo" }
openssl = ">=3.0,<4"
ca-certificates = "*"
zlib = ">=1.3.1,<2"
libbrotlicommon = ">=1,<2"
libbrotlidec = ">=1,<2"
libbrotlienc = ">=1,<2"

# flare ships its shim builds as activation scripts, so an environment that
# has flare on its include path gets them built into $CONDA_PREFIX/lib the
# same way flare's own does. Without this the server starts, serves the scan,
# and then dies on the first dlopen.
[activation]
scripts = ["../flare_mlake/flare/tls/ffi/build.sh", "../flare_mlake/flare/http/ffi/build.sh"]

[tasks]
# The cross-language gates. Both verifiers are pyarrow rather than a reader we
# also wrote: a writer checked only against our own reader would prove the two
# agree and nothing about whether either matches Arrow.
emit = { cmd = "mkdir -p build && mojo build -I src -I ../flare_mlake tools/emit_stream.mojo -o build/emit && cd . && ./build/emit" }
verify-ipc = { cmd = "python tools/verify_ipc.py", depends-on = ["emit"] }

# `-I ../threads.mojo/...` is required by flare itself, not by this demo:
# flare's threading is an adapter over threads.mojo, so anything compiling
# flare from source needs it on the path.
serve = { cmd = "mkdir -p build && mojo build -I src -I ../flare_mlake -I ../threads.mojo/src -I ../threads.mojo/compat tools/serve_demo.mojo -o build/serve" }
verify-flight = { cmd = "bash tools/verify_flight.sh", depends-on = ["serve"] }

# The Iceberg-backed server pulls in the whole read stack, which is why the
# include list is long: iceberg needs avro and parquet, parquet needs arrow,
# thrift and the four codecs, and everything needs threads.
#
# threads.mojo 0.6.0 collapsed `compat/stable` and `compat/nightly` into one
# `compat/`: the split carried the spelling of `std.atomic.Atomic`'s
# parameter, which only Mojo 1.0.0 took as a `DType`.
serve-iceberg = { cmd = "mkdir -p build && mojo build -I src -I ../flare_mlake -I ../iceberg.mojo/src -I ../parquet.mojo/src -I ../parquet.mojo/full/src -I ../arrow-mlake.mojo/src -I ../avro.mojo/src -I ../deflate.mojo/src -I ../thrift.mojo/src -I ../zstd.mojo/src -I ../snappy.mojo/src -I ../lz4.mojo/src -I ../brotli.mojo/src -I ../hashes.mojo/src -I ../roaring.mojo/src -I ../objectstore.mojo/src -I ../threads.mojo/src -I ../threads.mojo/compat tools/serve_iceberg.mojo -o build/serve_ice" }
verify-iceberg = { cmd = "bash tools/verify_iceberg.sh", depends-on = ["serve-iceberg"] }

# The same binary in both roles: two workers, and a coordinator whose endpoints
# point at them. The client fetches from the workers directly, so this is the
# gate that would fail if `Location` were dropped, wrong, or all on one worker.
verify-cluster = { cmd = "bash tools/verify_cluster.sh", depends-on = ["serve-iceberg"] }

fmt = { cmd = "mojo format src tools" }

[feature.verify.dependencies]
# pyarrow's conda build splits Flight into libarrow-flight; without it
# `import pyarrow.flight` raises ImportError at the dlopen.
python = "3.12.*"
pyarrow = ">=21"
libarrow-flight = ">=21"
# Writes the table the iceberg gate reads, so the Flight server is checked
# against one the reference implementation produced.
pyiceberg = ">=0.9"
sqlalchemy = ">=2"

[environments]
default = { solve-group = "default" }
verify = { features = ["verify"], solve-group = "default" }
